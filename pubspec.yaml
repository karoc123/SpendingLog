name: spending_log
description: "SpendingLog – Personal expense tracker with smart autocomplete, recurring expenses, and local-only privacy."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.2

  # Navigation
  go_router: ^17.5.0

  # Database
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1

  # Charts
  fl_chart: ^1.2.0

  # Biometrics
  local_auth: ^3.0.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.6.0
  csv: ^8.0.0
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  file_picker: ^12.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "app_icon.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/default_categories/de_defaults.json
    - assets/default_categories/en_defaults.json
